<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1b"><meta name="description" content="Neon Frequency — an immersive first-person music adventure.">
<title>NEON FREQUENCY // POV</title>
<style>
:root{--cyan:#54f7ed;--pink:#ff4b9a;--gold:#ffe28a;--ink:#050916;--glass:#071323d9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030713;color:#efffff;font:15px/1.45 system-ui, sans-serif}body{min-height:100svh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#game{position:relative;width:min(100%,1180px);height:100svh;min-height:570px;margin:auto;overflow:hidden;background:#081329;isolation:isolate}
#view{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#101c43 0%,#1d2351 43%,#090e20 100%)}
#view:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 36%,#ff5ca533,transparent 35%),linear-gradient(90deg,#03071388,transparent 30%,transparent 70%,#03071388);z-index:1;pointer-events:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .3s,transform .25s}
#world .neon{filter:drop-shadow(0 0 9px var(--cyan))}
#world .window{fill:#62f8ed;opacity:.8;filter:drop-shadow(0 0 8px #55fff2)}
#world .floorline{stroke:#4cf7e8;stroke-opacity:.34;stroke-width:2}
#world .object{cursor:pointer;filter:drop-shadow(0 0 9px #ffdc79);transform-box:fill-box;transform-origin:center;animation:float 2.5s ease-in-out infinite}
#world .object:focus{outline:none;filter:drop-shadow(0 0 15px white)}
@keyframes float{50%{transform:translateY(-7px)}}
#crosshair{position:absolute;z-index:4;left:50%;top:49%;width:19px;height:19px;transform:translate(-50%,-50%);opacity:.8;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#d9ffff;box-shadow:0 0 7px var(--cyan)}
#crosshair:before{width:1px;height:19px;left:9px}#crosshair:after{height:1px;width:19px;top:9px}
#vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse,transparent 45%,#020510aa 100%)}
#topHud{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 25px;background:linear-gradient(#030714d9,transparent)}
.brand{font-weight:1000;letter-spacing:.13em;font-size:12px;color:var(--cyan);text-shadow:0 0 12px #54f7ed88}.zone{font-size:10px;letter-spacing:.16em;color:#fff;text-align:right;text-transform:uppercase}
#vitals{display:flex;gap:7px;align-items:center}.vital{background:#071323bb;border:1px solid #54f7ed66;border-radius:8px;padding:5px 8px;font-size:11px;white-space:nowrap}.vital b{color:var(--gold)}
#quest{position:absolute;z-index:6;top:72px;left:12px;max-width:min(60%,360px);padding:7px 10px;border-left:2px solid var(--pink);background:#050b1bcc;font-size:11px;color:#e8faff}
#sceneTitle{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
#bottomHud{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:28px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#030713f5 25%);display:grid;gap:8px}
#message{max-width:760px;margin:auto;width:100%;min-height:42px;padding:9px 12px;border:1px solid #54f7ed55;border-radius:10px;background:#061323d9;backdrop-filter:blur(8px);font-size:13px;text-shadow:0 1px 3px #000}
#message strong{color:var(--gold)}#prompt{font-size:10px;color:#a8cbd5;letter-spacing:.1em;text-align:center;min-height:14px}
#actionRow{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}
.action{border:1px solid #4deadd88;border-radius:9px;background:linear-gradient(145deg,#12324bdf,#10142edc);padding:9px 12px;font-size:11px;font-weight:850;box-shadow:0 0 13px #1bd6d422}
.action.primary{background:linear-gradient(110deg,#126a86,#7d235c);border-color:#ff6fb6}.action:active{transform:scale(.97)}
#quickbar{display:flex;justify-content:center;gap:6px;min-height:35px;align-items:center}
.slot{min-width:35px;height:35px;border:1px solid #54f7ed66;border-radius:7px;background:#071323d9;display:grid;place-items:center;font-size:17px;position:relative}
.slot small{position:absolute;right:2px;bottom:0;font-size:7px;color:var(--gold)}
#movePad{position:absolute;z-index:8;left:12px;bottom:130px;display:grid;grid-template-columns:34px 34px 34px;grid-template-rows:34px 34px 34px;gap:3px;opacity:.9}
#movePad button{border:1px solid #54f7ed66;border-radius:7px;background:#061323aa;font-size:14px}
#movePad .up{grid-column:2;grid-row:1}#movePad .left{grid-column:1;grid-row:2}#movePad .down{grid-column:2;grid-row:2}#movePad .right{grid-column:3;grid-row:2}
#interact{position:absolute;z-index:8;right:12px;bottom:148px;width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);background:#7d3b23aa;box-shadow:0 0 20px #ffce5c55;font-size:11px;font-weight:950}
#inventoryPeek{position:absolute;z-index:6;right:12px;top:72px;display:flex;gap:4px}
#inventoryPeek .slot{width:30px;height:30px;min-width:30px;font-size:14px}
#choiceLayer{position:absolute;z-index:12;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:#02061155}
#choiceLayer.open{display:flex}
#choicePanel{width:min(760px,100%);max-height:70%;overflow:auto;border:1px solid var(--cyan);border-radius:15px;background:linear-gradient(145deg,#0b1a30f5,#11102af5);padding:13px;box-shadow:0 0 35px #54f7ed33;backdrop-filter:blur(12px)}
#choicePanel h2{font-size:13px;color:var(--gold);letter-spacing:.12em;margin:0 0 5px}#choicePanel p{font-size:12px;color:#c6dce8;margin:0 0 10px}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.choice{border:1px solid #54718a;border-radius:9px;background:#152641;padding:10px;text-align:left;font-size:12px}.choice b{display:block;color:#fff;margin-bottom:3px}.choice small{display:block;color:#a9c5d4;font-size:10px}
#menu{position:absolute;z-index:14;top:10px;right:10px}
#menuPanel{display:none;position:absolute;right:0;top:34px;width:190px;padding:8px;border:1px solid var(--cyan);border-radius:10px;background:#061323f2;box-shadow:0 8px 24px #0009}
#menuPanel.open{display:grid;gap:6px}
#menuPanel button{background:#122641;border:1px solid #41647b;border-radius:7px;padding:8px;text-align:left;font-size:11px}
#notice{position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(85%,420px);padding:17px;border:1px solid var(--gold);border-radius:13px;background:#081326f5;text-align:center;display:none;box-shadow:0 0 35px #000}
#notice.open{display:block}#notice h2{font-size:18px;color:var(--gold)}#notice p{font-size:13px}
#bossFlash{position:absolute;inset:0;z-index:5;pointer-events:none;background:#ff255533;opacity:0;transition:opacity .2s}
@media(min-width:760px){#bottomHud{padding-left:90px;padding-right:90px}#movePad{left:25px;bottom:160px;transform:scale(1.15)}#interact{right:28px;bottom:175px;width:78px;height:78px}#quest{top:78px;left:22px}#inventoryPeek{right:22px;top:78px}}
@media(max-width:420px){#quest{top:67px;max-width:62%;font-size:10px}#vitals{gap:4px}.vital{font-size:9px;padding:4px 6px}#movePad{bottom:139px;left:8px;transform:scale(.9);transform-origin:bottom left}#interact{bottom:150px;right:9px;width:58px;height:58px}#choices{grid-template-columns:1fr}#choicePanel{max-height:74%}#message{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="game" aria-label="Neon Frequency first person adventure">
<div id="view">
<svg id="world" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First person view of the neon city">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101a42"/><stop offset="1" stop-color="#451d58"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#1c2947"/><stop offset="1" stop-color="#050a17"/></linearGradient>
 <linearGradient id="hall" x2="0" y2="1"><stop stop-color="#19294c"/><stop offset="1" stop-color="#080d1e"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<g id="environment">

 <circle cx="800" cy="120" r="75" fill="#ff4b9a" opacity=".17"/>
 <path d="M0 330L0 190 90 190 90 280 170 280 170 140 280 140 280 300 370 300 370 185 480 185 480 300 580 300 580 120 710 120 710 290 820 290 820 170 940 170 940 270 1000 270 1000 390Z" fill="#111b3b"/>
 <g class="window"><path d="M110 218h24v38h-24zm88-46h25v43h-25zm93 102h26v24h-26zm130-58h24v34h-24zm150-42h29v40h-29zm163 49h26v34h-26zm111-19h28v37h-28z"/></g>
 <path d="M0 355L1000 355 1000 700 0 700Z" fill="url(#ground)"/>
 <path d="M0 365L500 440 1000 365M0 470L500 490 1000 470M0 585L500 545 1000 585" fill="none" stroke="#54f7ed" stroke-opacity=".2" stroke-width="3"/>
 <path d="M500 440L250 700M500 440L750 700M500 440V700" fill="none" stroke="#54f7ed" stroke-opacity=".23" stroke-width="2"/>
 <path d="M50 345L150 250 235 345M765 345L850 235 950 345" fill="none" stroke="#ff4b9a" stroke-width="12" opacity=".55" filter="url(#glow)"/>
</g>

 <path d="M0 700L0 625Q55 580 160 594L235 700Z" fill="#111b35" stroke="#5bf4e7" stroke-width="4"/>
 <path d="M1000 700L1000 625Q945 580 840 594L765 700Z" fill="#111b35" stroke="#ff4b9a" stroke-width="4"/>
 <path d="M75 645L185 612 225 650 195 700H55Z" fill="#28314c"/>
 <path d="M925 645L815 612 775 650 805 700H945Z" fill="#28314c"/>
 <path d="M115 647l50-13m-35 31 57-16m648-2 50 13m-35-31-57-16" stroke="#54f7ed" stroke-width="5" opacity=".7"/>
</g>
</svg>
<div id="crosshair"></div><div id="vignette"></div><div id="bossFlash"></div>
</div>
<header id="topHud"><div><div class="brand">NEON / FREQUENCY</div><div id="sceneTitle">THE LAST TRACK</div></div><div id="vitals"><div class="vital">♥ <b id="health">100</b></div><div class="vital">♫ <b id="energy">3</b></div><div class="vital">REP <b id="rep">0</b></div></div></header>
<div id="quest">OBJECTIVE: Find the source of the forbidden signal.</div>
<div id="inventoryPeek" aria-label="Quick item slots"></div>
<div id="movePad" aria-label="Move through the world"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div>
<button id="interact" aria-label="Interact with the object ahead">A<br>INTERACT</button>
<section id="bottomHud">
 <div id="message" aria-live="polite"><strong>11:47 PM</strong> — Rain hits the pavement. Your MP3 player lights up with a track that should not exist.</div>
 <div id="prompt">WASD / ARROW KEYS TO MOVE · E / A TO INTERACT</div>
 <div id="actionRow"><button class="action primary" id="talk">💬 TALK</button><button class="action" id="pulse">♫ ECHO PULSE</button><button class="action" id="save">▣ SAVE</button></div>
 <div id="quickbar" aria-label="Quick inventory slots"><span class="slot">🎧</span><span class="slot">—</span><span class="slot">—</span><span class="slot">—</span></div>
</section>
<div id="menu"><button class="action" id="menuButton">☰</button><div id="menuPanel"><button id="voice">🔊 Character voices: ON</button><button id="read">📖 Read current scene</button><button id="stop">⏹ Stop voice</button><button id="load">↻ Load saved run</button><button id="restart">✦ Restart adventure</button></div></div>
<div id="choiceLayer"><section id="choicePanel"><h2 id="choiceTitle">WHAT DO YOU DO?</h2><p id="choiceText">Your next move changes the story.</p><div id="choices"></div></section></div>
<div id="notice"><h2 id="noticeTitle"></h2><p id="noticeText"></p><button class="action primary" id="noticeClose">CONTINUE</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const scenes={
 start:{title:"The Last Track",zone:"NEON CITY · 11:47 PM",objective:"Investigate the strange signal.",text:"Rain hammers the pavement. Every radio in Neon City has gone silent—except the scratched blue MP3 player in your hand. A new file appears: LAST_TRACK_01.mp3. Across the street, a black Sonora van idles beside a shuttered music shop.",objects:[["📻","Radio signal","A payphone radio crackles with a melody buried under the rain.", "signal"],["💿","Lost disc","A silver disc lies in a puddle. Its label reads DJ ZERO.", "disc"],["🚪","Music shop","The locked shop door vibrates with a bass note.", "shop"]],choices:[["🎧 Listen to the forbidden track","Follow the signal into the night.","signal",{energy:-1,rep:1,items:["Encrypted Track"]}],["📟 Call Juno","Trust your old bandmate and ask for help.","juno",{trust:1,crew:["Juno"]}],["🕹️ Enter the Neon Arcade","Search the abandoned cabinets for clues.","arcade",{items:["Arcade Token"],rep:1}]]},
 signal:{title:"Frequency 99.7",zone:"FREQUENCY RIDGE",objective:"Reach the hidden subway entrance.",text:"The melody reveals a route through the rain. A sound hunter sweeps the street with a scanner that detects stolen songs. The signal pulses from a beacon above the subway stairs.",objects:[["📡","Signal beacon","A three-beat pattern repeats: kick, snare, silence.","beacon"],["🎵","Floating note","A stray note shimmers in the wet air.","note"],["🚇","Subway stairs","A cold draft carries the sound of thousands of trapped songs.","subway"]],choices:[["🚇 Slip into the subway","Risk the dark and get closer to the source.","subway",{energy:-1,rep:1}],["💻 Decode the signal","Use a public terminal to trace the broadcast.","terminal",{items:["Decoded Coordinates"],trust:1}]]},
 juno:{title:"Juno’s Workshop",zone:"OLD INDUSTRIAL DISTRICT",objective:"Choose your gear and get to Platform Zero.",text:"Juno opens the door surrounded by broken synthesizers and cassette decks. “Sonora is siphoning songs into a central archive,” they say. “I can help—but we need proof.” A beat-sampler rests on the workbench.",speaker:"Juno",line:"Every lock in this city has a rhythm. Let’s find the right one.",objects:[["🎛️","Beat sampler","The sampler syncs to the pulse of the archive.","sampler"],["🔋","Signal battery","A spare cell hums with stored energy.","battery"],["📼","Cassette deck","A recording whispers: Platform Zero.","cassette"]],choices:[["🎹 Take the beat-sampler","Gain a tool for rhythm locks and earn Juno’s trust.","sampler",{items:["Beat Sampler"],trust:1,crew:["Juno"]}],["🛹 Ask Juno to distract the guards","Move fast and keep your gear light.","subway",{energy:1,rep:1,crew:["Juno"]}]]},
 arcade:{title:"The Neon Arcade",zone:"ARCADE DISTRICT",objective:"Find the hidden cassette.",text:"Dusty cabinets wake up one by one. A rhythm machine flashes THREE BEATS OPEN THE DOOR. Boots echo on the stairs behind you.",objects:[["🕹️","Rhythm cabinet","Kick, snare, silence. The machine waits for your input.","rhythm"],["🎟️","Arcade token","A token is wedged beside the cabinet.","token"],["🚪","Maintenance hatch","A narrow hatch leads below the arcade.","hatch"]],choices:[["🥁 Play the three-beat pattern","Solve the rhythm lock and reveal a secret cassette.","subway",{items:["DJ ZERO Cassette","Arcade Token"],rep:1}],["🔧 Force the maintenance hatch","Fast, noisy, and likely to attract attention.","subway",{energy:-1,rep:-1}]]},
 terminal:{title:"A Song in the Machine",zone:"DATA SHRINE",objective:"Use the coordinates to find Mira.",text:"The terminal decrypts a voice memo from DJ ZERO: “The archive can be destroyed, copied, or turned against them. Choose carefully.” A security alert starts blinking.",speaker:"DJ ZERO",line:"If you can hear this, the music survived. Make it mean something.",objects:[["📼","Voice memo","DJ ZERO’s message is stored on a cassette.","cassette"],["🗺️","Coordinates","The route points to Platform Zero.","coords"],["⚠️","Security alert","Sonora knows someone is inside the system.","alert"]],choices:[["📼 Copy the coordinates","Keep portable proof and head underground.","subway",{items:["Decoded Coordinates"],rep:1}],["📡 Broadcast the memo","Expose Sonora and warn them you are coming.","broadcast",{trust:1,rep:2}]]},
 sampler:{title:"A Better Kind of Noise",zone:"PLATFORM ZERO",objective:"Decide whether to trust Mira.",text:"Juno’s beat-sampler mimics the archive access rhythm. At Platform Zero, a masked engineer named Mira blocks the way. “I work for Sonora,” they say, “but what they’re doing is wrong.”",speaker:"Mira",line:"Trust is a signal. Show me what you do, not what you promise.",objects:[["🛰️","Mira","The masked engineer watches your hands.","mira"],["🔐","Archive console","A rhythm lock guards the console.","console"],["🚇","Ghost train","Cassette tapes fill the empty train.","train"]],choices:[["🤝 Accept Mira’s deal","Build an alliance that may matter later.","mira",{trust:1,crew:["Juno","Mira"]}],["🔐 Unlock the console","Use the sampler and take control yourself.","control",{energy:1,items:["Access Key"]}]]},
 subway:{title:"Platform Zero",zone:"UNDER THE CITY",objective:"Find a way into Sonora’s archive.",text:"Below the street, a machine pulls melodies from thousands of cassette tapes. A masked engineer blocks the way. Their badge reads MIRA. They look from your evidence to the gear in your hands.",speaker:"Mira",line:"I know what Sonora is doing. But I need a reason to trust you.",objects:[["🚇","Ghost train","The train is packed with tapes from vanished musicians.","train"],["📼","Lost cassette","A cassette marked DJ ZERO is wedged under a seat.","cassette"],["🛰️","Masked engineer","Mira waits beside the archive door.","mira"]],choices:[["🤝 Offer Mira your evidence","Show proof and win a powerful ally.","mira",{trust:2,crew:["Mira"]}],["🎛️ Challenge Mira to a rhythm duel","Win respect with skill instead of trust.","duel",{rep:2,energy:-1}],["🏃 Dash toward the control room","Move fast before the machine finishes its cycle.","control",{energy:-1,rep:1}]]},
 duel:{title:"Beat for Beat",zone:"PLATFORM ZERO · RHYTHM DUEL",objective:"Win the rhythm duel.",text:"Mira taps a syncopated rhythm on the rail. Your sampler catches the pattern, but the last beat is missing. The floor vibrates as the archive powers up.",objects:[["🥁","Rhythm pattern","The missing beat is a rest, not a note.","rhythm"],["🎛️","Beat sampler","Your sampler can complete the phrase.","sampler"],["🛰️","Mira","Mira waits for your final beat.","mira"]],choices:[["🎚️ Improvise the final beat","A daring move earns respect.","mira",{rep:2,crew:["Mira"]}],["🪙 Replay the pattern slowly","Careful timing earns trust.","mira",{trust:1,crew:["Mira"]}]]},
 mira:{title:"Mira’s Secret",zone:"THE ARCHIVE DISTRICT",objective:"Choose how to confront Sonora.",text:"Mira reveals Sonora’s director plans to replace every original song with one controlled frequency. The archive has three failsafes: free the songs, steal the master library, or hijack the broadcast. Juno waits for your call.",speaker:"Mira",line:"The city deserves to hear itself again.",objects:[["💿","Master library","Thousands of stolen recordings pulse inside the archive.","library"],["🔓","Archive failsafe","Three options glow on the security panel.","failsafe"],["📡","Broadcast tower","A transmission can reach every speaker in the city.","tower"]],choices:[["💙 Free every song","Protect the music, even if it costs you power.","control",{trust:2,rep:1}],["💿 Take the master library","Keep the ultimate collection for yourself.","library",{rep:2,items:["Master Library"]}],["📡 Hijack Sonora’s broadcast","Turn their network into a citywide stage.","broadcast",{rep:1,trust:1}]]},
 library:{title:"Every Song in Your Hands",zone:"SONORA ARCHIVE",objective:"Decide who owns the music.",text:"The master library is yours: every lost demo, live set, and private recording. Your crew watches, waiting to see what you have become.",objects:[["🎼","Open archive","A public release would return the music to everyone.","archive"],["👑","Private vault","The library could make you powerful.","vault"],["📻","Broadcast console","The city is ready to hear the truth.","broadcast"]],choices:[["🌐 Release it freely","Give up control and let music spread.","boss",{trust:2}],["👑 Keep the library","Become the most powerful collector in the city.","collectorEnding",{rep:3,trust:-2}]]},
 control:{title:"The Master Switch",zone:"SONORA CONTROL ROOM",objective:"Choose the fate of the archive.",text:"Three options glow on the console: PURGE, COPY, TRANSMIT. A thousand trapped songs fight to be heard. The machine is overheating.",objects:[["🗝️","Access key","A hidden restore function is available.","key"],["💥","Core reactor","Destroying it will stop Sonora immediately.","core"],["📡","Transmit switch","A citywide signal can expose everything.","transmit"]],choices:[["🗝️ Restore the archive","Choose repair over revenge.","goodEnding",{trust:2,rep:1}],["💥 Destroy the core","Stop Sonora, even if recordings are lost.","purgeEnding",{rep:1,energy:-2}],["📡 Force a citywide transmission","Broadcast the archive before collapse.","broadcast",{rep:2,energy:-1}]]},
 broadcast:{title:"Open Airwaves",zone:"THE WHOLE CITY IS LISTENING",objective:"Prepare for the final showdown.",text:"Your signal cuts through every speaker, phone, and arcade cabinet. The city hears the stolen songs for the first time. Sonora deploys a final jammer. A giant screen flashes: DIRECTOR VEX — FINAL SECURITY PROTOCOL.",speaker:"DJ ZERO",line:"The signal is live. But Director Vex is coming. Get ready for the final battle.",objects:[["📡","Broadcast relay","The relay is holding the signal open.","relay"],["⚡","Jammer","A jammer is draining your energy.","jammer"],["🏙️","City speakers","Thousands of lights answer your signal.","speakers"]],choices:[["⚔️ Confront Director Vex","Face the boss and decide the city’s future.","boss",{rep:1}],["🤝 Call your crew","Your allies prepare a coordinated attack.","boss",{trust:1}]]},
 boss:{title:"Director Vex: The Silence Engine",zone:"SONORA TOWER · FINAL BOSS",objective:"Break the Silence Engine.",boss:true,text:"Director Vex steps into the neon arena, wired into a towering machine that absorbs every sound. The Silence Engine drains your signal energy. A chrome mask pulses to a cold, perfect rhythm.",speaker:"Director Vex",line:"Music is power. And I control every frequency. One final beat, and your revolution goes silent.",objects:[["🦾","Director Vex","Vex raises a sonic blade. The fight begins.","vex"],["⚡","Silence Engine","The core skips a beat every few seconds.","engine"],["🎼","Final melody","The last melody can break the machine’s rhythm.","melody"]],choices:[["🎹 Counterattack with the Beat Sampler","Break the boss’s perfect rhythm.","bossVictory",{rep:2,energy:-1}],["📼 Expose Vex with DJ ZERO’s recording","Turn the city against Sonora.","bossExpose",{trust:1,rep:1}],["🤝 Attack with Juno and Mira","Overload the Silence Engine together.","bossCrew",{trust:2}],["⚡ Fight solo","Overload the engine at point-blank range.","bossHard",{energy:-1,rep:1}]]},
 bossHard:{title:"The Silence Engine Overloads",zone:"FINAL BOSS · LAST CHANCE",objective:"Make your final move.",boss:true,text:"Vex’s machine overwhelms your first attack. Sparks burst from the arena floor. Your signal drops to a single flicker. You can still win—but the cost is real.",speaker:"Director Vex",line:"The city will remember the silence!",objects:[["🎤","Crowd signal","The city is singing back through the static.","crowd"],["🔌","Core reactor","One final strike will end the machine.","core"],["⚡","Last charge","Your remaining energy is unstable.","charge"]],choices:[["🎤 Keep playing","Turn the crowd into a chorus.","rebelEnding",{rep:2}],["🔌 Destroy the core","End the machine, even if the archive is damaged.","purgeEnding",{energy:-2}]]},
 bossVictory:{title:"Vex Loses the Beat",zone:"BOSS DEFEATED",objective:"Choose the city's new beginning.",text:"The Beat Sampler finds a flaw in Vex’s rhythm. You land the final drop. The Silence Engine shatters in a storm of blue and red light. Stolen melodies flood back into the city.",speaker:"Juno",line:"You did it! The Silence Engine is breaking apart. All those songs are coming home!",objects:[["🌅","Open archive","The songs can return to their creators.","archive"],["📚","Public library","Preserve every recording for the future.","library"]],choices:[["🌅 Free the entire archive","The city gets its music back.","goodEnding",{trust:2,rep:1}],["📚 Build a public archive","Give every song a home.","libraryEnding",{trust:1}]]},
 bossExpose:{title:"Vex Unmasked",zone:"THE TRUTH GOES LIVE",objective:"Decide what happens to Sonora.",text:"You play DJ ZERO’s evidence through the tower. The city hears Vex ordering the theft of every song. His security team lowers their weapons. Fear is no longer powering the Silence Engine.",speaker:"Mira",line:"The truth is public. Vex cannot erase what the whole city has heard.",objects:[["📡","Airwaves","The city can take back the airwaves.","airwaves"],["💙","Song archive","Return every track to its creator.","archive"]],choices:[["📡 Let the city own the airwaves","Turn the broadcast into a revolution.","rebelEnding",{rep:2,trust:1}],["💙 Return the songs","Choose restoration over revenge.","goodEnding",{trust:2}]]},

 goodEnding:{title:"A Thousand Voices",zone:"ENDING · THE CITY SINGS AGAIN",ending:"CITY SINGS AGAIN",objective:"The city has found its voice.",text:"The archive opens and stolen songs return to their creators. Juno hosts a rooftop concert, Mira leaks Sonora’s records, and the old arcades become community studios. A new file appears on your player: NEXT_TRACK.wav.",objects:[["🎶","Rooftop concert","The whole city sings together.","ending"],["📻","Open airwaves","Independent stations are back on air.","ending"],["🌟","Next track","A new melody waits for you.","ending"]]},
 purgeEnding:{title:"The Core Goes Dark",zone:"ENDING · THE SILENCE BREAKER",ending:"SILENCE BREAKER",objective:"Sonora’s machine is gone.",text:"You destroy the extraction core. Sonora can no longer steal a melody. Some recordings are lost, but independent musicians begin rebuilding from memory.",objects:[["🌃","Quiet skyline","The city begins to rebuild.","ending"],["🎵","Surviving melody","One song remains in the static.","ending"]]},
 rebelEnding:{title:"Turn It All the Way Up",zone:"ENDING · THE UNDERGROUND RISES",ending:"UNDERGROUND RISES",objective:"The city owns the airwaves.",text:"Your live performance overwhelms Sonora’s jammer. Rooftops become dance floors and the company loses control of the airwaves. Music is ours.",objects:[["🎤","Rooftop stage","A new generation takes the mic.","ending"],["📻","Pirate radio","The signal spreads beyond the city.","ending"]]},

 collectorEnding:{title:"The Golden Cage",zone:"ENDING · THE PRIVATE COLLECTION",ending:"GOLDEN CAGE",objective:"You own every song—but who will share it?",text:"You escape with the complete master library. Collectors adore you, but your old crew stops calling. You have every song—and almost nobody to share them with.",objects:[["💿","Master library","Every lost recording is yours.","ending"],["📻","Silent radio","The silence between tracks feels different now.","ending"]]}
};
let state={id:"start",health:100,energy:3,rep:0,trust:0,items:["MP3 Player"],crew:[],history:[],visited:[],used:[],voice:true,position:0};
const palettes={start:["#14244b","#29386b","#54f7ed"],signal:["#10284b","#2c4972","#79f3d4"],juno:["#1c1d48","#49346a","#ff83d0"],arcade:["#28194d","#503278","#ff83c9"],terminal:["#13224b","#344c76","#6ff5ed"],sampler:["#132744","#294f64","#ff83d0"],subway:["#111e39","#33465c","#71ffc2"],duel:["#281b46","#55416e","#ffe28a"],mira:["#151d42","#3a3c70","#73f3ee"],library:["#201b49","#47376c","#f3d77b"],control:["#24183d","#5c285a","#ff718f"],broadcast:["#172147","#374879","#54f7ed"],boss:["#29133c","#63234e","#ff5b82"],bossHard:["#35122d","#742447","#ff5b82"],bossVictory:["#182447","#315e78","#ffe28a"],bossExpose:["#1b2146","#4a3d72","#54f7ed"],bossCrew:["#182447","#315e78","#ffe28a"],goodEnding:["#174254","#3b7a7a","#ffe28a"],purgeEnding:["#17213b","#3b435c","#ff8d8d"],rebelEnding:["#351842","#78406e","#ff73c7"],libraryEnding:["#17384a","#477b83","#ffe28a"],crewEnding:["#183d45","#427b74","#ffe28a"],collectorEnding:["#281c43","#574069","#d6b4ff"]};
function applyFx(f={}){state.rep=Math.max(0,state.rep+(f.rep||0));state.energy=Math.max(0,Math.min(5,state.energy+(f.energy||0)));state.trust+=f.trust||0;(f.items||[]).forEach(x=>{if(!state.items.includes(x))state.items.push(x)});(f.crew||[]).forEach(x=>{if(!state.crew.includes(x))state.crew.push(x)})}
function save(){try{localStorage.setItem("neon-frequency-pov-save",JSON.stringify(state));message("GAME SAVED","Your progress is stored on this device.")}catch(e){message("SAVE UNAVAILABLE","This browser could not store the game.")}}
function load(){try{const s=JSON.parse(localStorage.getItem("neon-frequency-pov-save"));if(!s||!scenes[s.id])throw Error();state=s;render();message("RUN RESTORED","Welcome back to Neon City.")}catch(e){message("NO SAVE FOUND","Start a new run and save at any time.")}}
function message(title,body){$("noticeTitle").textContent=title;$("noticeText").textContent=body;$("notice").classList.add("open")}
$("noticeClose").onclick=()=>$("notice").classList.remove("open");
function say(line,role="Narrator"){if(!state.voice||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line);u.lang="en-US";u.rate=.94;u.pitch=role==="Director Vex"?.68:role==="Juno"?1.2:role==="Mira"?1.03:.92;speechSynthesis.speak(u)}
function updateHud(){const s=scenes[state.id];$("sceneTitle").textContent=s.title.toUpperCase();$("quest").textContent="OBJECTIVE: "+s.objective;$("health").textContent=state.health;$("energy").textContent=state.energy;$("rep").textContent=state.rep;const inv=$("inventoryPeek");inv.innerHTML="";const icons={"MP3 Player":"🎧","Encrypted Track":"📼","Decoded Coordinates":"🧭","Beat Sampler":"🎛️","Arcade Token":"🪙","DJ ZERO Cassette":"📼","Access Key":"🗝️","Master Library":"💿"};state.items.slice(0,5).forEach((x,i)=>{const d=document.createElement("div");d.className="slot";d.title=x;d.textContent=icons[x]||"✦";const sm=document.createElement("small");sm.textContent=i+1;d.append(sm);inv.append(d)});$("quickbar").innerHTML="";state.items.slice(0,4).forEach((x,i)=>{const d=document.createElement("div");d.className="slot";d.title=x;d.textContent=icons[x]||"✦";const sm=document.createElement("small");sm.textContent=i+1;d.append(sm);$("quickbar").append(d)});while($("quickbar").children.length<4){const d=document.createElement("div");d.className="slot";d.textContent="—";$("quickbar").append(d)}}
function buildWorld(){const s=scenes[state.id],pal=palettes[state.id]||palettes.start;const root=$("environment");root.querySelector("rect").setAttribute("fill",pal[0]);const objs=$("sceneObjects");objs.innerHTML="";const isInterior=["juno","arcade","terminal","sampler","subway","duel","mira","library","control","boss","bossHard","bossVictory","bossExpose","bossCrew"].includes(state.id);const wall=document.createElementNS("http://www.w3.org/2000/svg","path");wall.setAttribute("d",isInterior?"M90 365V150L500 70 910 150V365Z":"M0 355L1000 355 1000 700 0 700Z");wall.setAttribute("fill",isInterior?pal[1]:"none");wall.setAttribute("opacity",".68");objs.append(wall);
const glow=document.createElementNS("http://www.w3.org/2000/svg","path");glow.setAttribute("d","M250 355L500 170 750 355");glow.setAttribute("stroke",pal[2]);glow.setAttribute("stroke-width","9");glow.setAttribute("fill","none");glow.setAttribute("filter","url(#glow)");objs.append(glow);
s.objects.forEach((o,i)=>{const x=[240,500,760][i%3],y=[350,300,355][i%3],g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","object");g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label","Interact with "+o[1]);g.dataset.name=o[1];g.dataset.desc=o[2];g.dataset.kind=o[3];const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");halo.setAttribute("cx",x);halo.setAttribute("cy",y-32);halo.setAttribute("r",38);halo.setAttribute("fill",pal[2]);halo.setAttribute("opacity",".15");halo.setAttribute("stroke",pal[2]);halo.setAttribute("stroke-width","3");g.append(halo);const label=document.createElementNS("http://www.w3.org/2000/svg","text");label.setAttribute("x",x);label.setAttribute("y",y-19);label.setAttribute("font-size","47");label.setAttribute("text-anchor","middle");label.textContent=o[0];g.append(label);const base=document.createElementNS("http://www.w3.org/2000/svg","path");base.setAttribute("d","M"+(x-65)+" "+y+"h130l25 85h-180z");base.setAttribute("fill","#071323");base.setAttribute("stroke",pal[2]);base.setAttribute("stroke-width","3");g.append(base);const name=document.createElementNS("http://www.w3.org/2000/svg","text");name.setAttribute("x",x);name.setAttribute("y",y+52);name.setAttribute("fill","#fff");name.setAttribute("font-size","14");name.setAttribute("font-weight","bold");name.setAttribute("text-anchor","middle");name.textContent=o[1].toUpperCase();g.append(name);g.addEventListener("click",()=>interact(o));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();interact(o)}});objs.append(g)});
if(s.boss){$("bossFlash").style.opacity=".35";setTimeout(()=>$("bossFlash").style.opacity="0",240)}}
function interact(o){$("message").innerHTML="<strong>"+o[1].toUpperCase()+"</strong> — "+o[2];$("prompt").textContent="INTERACTION LOGGED · CHOOSE YOUR NEXT MOVE";if(o[3]==="disc"&&!state.items.includes("DJ ZERO Cassette")){state.items.push("DJ ZERO Cassette");updateHud()}if(o[3]==="battery"){state.energy=Math.min(5,state.energy+1);updateHud()}if(o[3]==="note"||o[3]==="token"){state.rep++;updateHud()}if(o[3]==="mira"&&state.voice)say(o[2],"Mira");if(o[3]==="vex"&&state.voice)say(o[2],"Director Vex")}
function openChoices(){const s=scenes[state.id];if(!s.choices)return;$("choiceTitle").textContent=s.ending?"THE STORY CONTINUES IN YOU":s.boss?"CHOOSE YOUR ATTACK":"WHAT DO YOU DO?";$("choiceText").textContent=s.ending?"You reached the "+s.ending+" ending. Start another run to discover a different path.":"Your decision changes your route, your allies, and the ending.";const host=$("choices");host.innerHTML="";s.choices.forEach(c=>{const b=document.createElement("button");b.className="choice";b.innerHTML="<b>"+c[0]+"</b><small>"+c[1]+"</small>";b.onclick=()=>{state.history.push(state.id);applyFx(c[3]);state.id=c[2];render();$("choiceLayer").classList.remove("open")};host.append(b)});$("choiceLayer").classList.add("open")}
function render(){const s=scenes[state.id];if(!s)return;buildWorld();updateHud();$("message").innerHTML="<strong>"+s.zone+"</strong> — "+s.text;if(s.speaker&&s.line){$("message").innerHTML+="<br><strong>"+s.speaker+":</strong> “"+s.line+"”";if(state.voice)say(s.line,s.speaker)}$("prompt").textContent=s.ending?"ENDING UNLOCKED · "+s.ending:"Explore the scene, interact with objects, then choose your next move.";if(s.ending){$("talk").textContent="✦ ENDING";$("talk").onclick=()=>message(s.ending,s.text)}else{$("talk").textContent="💬 TALK / DECIDE";$("talk").onclick=openChoices}state.visited.push(state.id)}
function move(dir){state.position=(state.position+1)%3;const w=$("world");w.style.transform=dir==="left"?"translateX(2%) scale(1.02)":dir==="right"?"translateX(-2%) scale(1.02)":dir==="forward"?"scale(1.06) translateY(1%)":"scale(1) translateY(-1%)";$("prompt").textContent="YOU MOVE "+dir.toUpperCase()+" · LOOK AROUND AND INTERACT";setTimeout(()=>w.style.transform="",180);const s=scenes[state.id];$("message").innerHTML="<strong>"+s.zone+"</strong> — You move through the scene. The neon reflections shift across the floor."}
function pulse(){if(state.energy<=0){$("message").textContent="Your Echo Lyre is out of energy. Find a signal battery or make your next move.";return}state.energy--;updateHud();$("world").style.filter="brightness(1.5) saturate(1.7)";setTimeout(()=>$("world").style.filter="",350);$("message").innerHTML="<strong>ECHO PULSE</strong> — A blue-green wave ripples through the room, revealing hidden traces of sound.";state.rep++}
document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.move)));$("interact").onclick=()=>{const objs=[...$("sceneObjects").querySelectorAll(".object")];const i=state.position%Math.max(1,objs.length);objs[i]?.dispatchEvent(new Event("click"))};$("talk").onclick=openChoices;$("pulse").onclick=pulse;$("save").onclick=save;
$("menuButton").onclick=()=>$("menuPanel").classList.toggle("open");$("voice").onclick=()=>{state.voice=!state.voice;$("voice").textContent=state.voice?"🔊 Character voices: ON":"🔇 Character voices: OFF";if(!state.voice&&"speechSynthesis"in window)speechSynthesis.cancel()};$("read").onclick=()=>{const s=scenes[state.id];say(s.text+" "+(s.line||""),s.speaker||"Narrator")};$("stop").onclick=()=>{if("speechSynthesis"in window)speechSynthesis.cancel()};$("load").onclick=load;$("restart").onclick=()=>{state={id:"start",health:100,energy:3,rep:0,trust:0,items:["MP3 Player"],crew:[],history:[],visited:[],used:[],voice:state.voice,position:0};$("menuPanel").classList.remove("open");render()};$("menuPanel").addEventListener("click",e=>{if(e.target.tagName==="BUTTON")$("menuPanel").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const tag=e.target?.tagName;if(["BUTTON","INPUT","TEXTAREA"].includes(tag))return;const keys={ArrowUp:"forward",w:"forward",W:"forward",ArrowDown:"back",s:"back",S:"back",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};if(keys[e.key]){e.preventDefault();move(keys[e.key])}else if(e.key==="e"||e.key==="E"){interactNearby()}else if(e.key===" "){e.preventDefault();openChoices()}});
function interactNearby(){const objs=[...$("sceneObjects").querySelectorAll(".object")];if(!objs.length)return;objs[state.position%objs.length].dispatchEvent(new Event("click"))}
$("interact").addEventListener("click",interactNearby);$("noticeClose").addEventListener("click",()=>$("notice").classList.remove("open"));
render();
</script>
